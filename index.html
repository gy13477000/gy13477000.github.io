<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人主页与常用在线工具集合" />
    <title>个人主页</title>
    <!--
      GitHub Pages SPA fallback (来自 spa-github-pages 方案)
      当用户直接访问 /tools/xxx 时, GitHub Pages 找不到该路径返回 404.html
      (内容与 index.html 完全一致). 这段脚本把原始路径作为 redirect 参数,
      重定向到首页 index.html, 然后由前端路由接管, 恢复目标路径.
    -->
    <script type="text/javascript">
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
