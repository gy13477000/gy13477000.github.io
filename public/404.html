<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人主页</title>
    <!--
      GitHub Pages SPA 404 fallback
      当用户访问 /tools/xxx 时 GitHub Pages 找不到文件, 返回此 404.html.
      这段脚本把当前路径编码成 ? redirect 参数, 跳转到 / (index.html),
      index.html 中的脚本会解码并恢复真实路径, 交给 Vue Router 处理.
      方案来源: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0 // 用户主页仓库 (<user>.github.io), 路径无前缀

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body>
    <!-- 此文件内容只有脚本, 不显示任何东西 -->
  </body>
</html>
